name: Bump Homebrew tap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to bump the tap to (e.g. v0.1.0)'
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Update formula in davidson-engineering/homebrew-tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: mpp
          formula-path: Formula/mpp.rb
          homebrew-tap: davidson-engineering/homebrew-tap
          base-branch: main
          tag-name: ${{ inputs.tag || github.ref_name }}
          download-url: https://github.com/davidson-engineering/mpp/archive/refs/tags/${{ inputs.tag || github.ref_name }}.tar.gz
          commit-message: |
            mpp {{version}}

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
