[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "chute"
dynamic = ["version"]
description = "Document pipeline — convert between docx, md, pdf, and html with a curated stack"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Matthew Davidson" }]
keywords = ["pandoc", "weasyprint", "markdown", "pdf", "docx", "document conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "pymupdf4llm>=0.0.17",
]

[project.urls]
Homepage = "https://github.com/davidson-engineering/chute"
Repository = "https://github.com/davidson-engineering/chute"
Issues = "https://github.com/davidson-engineering/chute/issues"

[project.scripts]
chute = "chute.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/chute/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chute"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chute",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pymupdf's SWIG bindings trip a Python 3.12+ deprecation on import.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
